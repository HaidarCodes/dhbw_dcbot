name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create runtime environment
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          test -n "$DEPLOY_ENV"
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > .env

      - name: Build image
        run: docker compose build --pull

      - name: Register Discord commands
        run: docker compose run --rm bot npm run register

      - name: Start new container
        run: docker compose up -d --force-recreate --remove-orphans

      - name: Verify container
        run: docker compose ps --status running --services bot | grep -Fxq bot

      - name: Remove runtime environment
        if: always()
        run: rm -f .env
