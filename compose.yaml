services:
  bot:
    image: dhbw-dcbot:local
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
    external: true
    name: dhbw-dcbot_bot-data
