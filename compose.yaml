services:
  bot:
    image: dhbw-dcbot:local
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - default
      - proxy
    environment:
      PORT: 3000
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
    external: true
    name: dhbw-dcbot_bot-data

networks:
  proxy:
    external: true
